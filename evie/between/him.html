<html>
<style>
    html,
    body,
    button {
        background-color: black;
        border: none;
    }

    .door,
    .tree-div,
    #interface1,
    #interface2,
    #interface3,
    #interface4 {
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .door {
        height: 90vh;
    }

    .tree-div {
        height: 80vh;
        display: none;
    }

    #interface1,
    #interface2,
    #interface3,
    #interface4 {
        display: none;
        position: fixed;
        bottom: 40px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
    }

    img {
        cursor: pointer;
    }

    button {
        outline: none;
        cursor: pointer;
    }
</style>

<div class="door" id="door">
    <button type="button" id="doorButton">
        <img class="clickable" src="/evie/between/assets/door.png">
    </button>
</div>

<div class="tree-div" id="treediv">
    <button type="button" id="treeButton">
        <img class="clickable" src="/evie/between/assets/tree.gif">
    </button>
</div>

<div class="interface" id="interface1">
    <img src="/evie/between/assets/man here.gif">
</div>

<div class="interface" id="interface2">
    <img src="/evie/between/assets/offered.gif">
</div>

<div class="interface" id="interface3">
    <img src="/evie/between/assets/received.gif">
</div>

<div class="interface" id="interface4">
    <img src="/evie/between/assets/not man here.gif">
</div>

<div class="reset" id="reset">
    <button type="button" id="resetbutton">
        <p style="color: white;">Reset</p>
    </button>
</div>

<audio id="manogg" src="/evie/between/assets/audio/man.ogg" loop></audio>
<audio id="obtain" src="/evie/between/assets/audio/obtain.mp3"></audio>
<audio id="blip" src="/evie/between/assets/audio/blip.wav"></audio>

<script>
    const door = document.getElementById("door");
    const doorbutton = document.getElementById("doorButton");

    const treediv = document.getElementById("treediv");
    const treebutton = document.getElementById("treeButton");

    const dialogue1 = document.getElementById("interface1");
    const dialogue2 = document.getElementById("interface2");
    const dialogue3 = document.getElementById("interface3");
    const dialogue4 = document.getElementById("interface4");

    const manogg = document.getElementById("manogg");
    const obtain = document.getElementById("obtain");
    const blip = document.getElementById("blip");
    const resetbutton = document.getElementById("resetbutton");
    
    resetbutton.addEventListener("click", () => {
        document.cookie = "egg=false; path=/";
        location.reload();
    });

    // Click door
    doorbutton.addEventListener("click", () => {
        door.style.display = "none";
        treediv.style.display = "flex";

        manogg.play();
    });

    // Click tree
    treebutton.addEventListener("click", () => {
        if (!document.cookie.includes("egg=true")) {
            dialogue1.style.display = "flex";
            blip.play();
        }
    });

    // Click dialogue 1
    dialogue1.addEventListener("click", () => {
        dialogue1.style.display = "none";
        dialogue2.style.display = "flex";
        blip.play();
    });

     // Click dialogue 2
    dialogue2.addEventListener("click", () => {
        dialogue2.style.display = "none";
        dialogue3.style.display = "flex";
        obtain.play();
        blip.play();
        document.cookie = "egg=true; path=/";
    });

    // Click dialogue 3
    dialogue3.addEventListener("click", () => {
        dialogue3.style.display = "none";
    });

    // Click tree after egg
    treebutton.addEventListener("click", () => {
        if (document.cookie.includes("egg=true")) {
            dialogue4.style.display = "flex";
            blip.play();
        }
    });

    //Click dialogue 4
    dialogue4.addEventListener("click", () => {
        dialogue4.style.display = "none";
    });


</script>

</html>
